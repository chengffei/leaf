<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="note" hidden><div id="note-body"></div><button id="note-go" type="button">前往注释所在位置</button></div>
<button id="back" type="button" hidden></button>
<div id="goto" hidden>
  <input id="goto-input" type="text" placeholder="百分比" spellcheck="false" autocomplete="off">
  <button id="goto-close" type="button">取消</button>
</div>
<div id="lightbox" hidden><img alt=""></div>
<footer id="status"><span id="chapter" title="目录 ⌘T"></span><input id="scrub" type="range" min="0" max="1000" value="0" title="拖动跳转"><span id="percent" title="点击切换：百分比 / 位置 / 本章剩余 / 全书剩余"></span></footer>
<div id="error" hidden></div>
<script>
const report = m => window.webkit?.messageHandlers?.leaf?.postMessage({ type: "error", message: m })
addEventListener("error", e => report(`${e.message} @${e.filename}:${e.lineno}`))
for (const level of ["error", "warn"]) {
  const orig = console[level]
  console[level] = (...a) => { orig(...a); report(`console.${level}: ${a.map(String).join(" ")}`) }
}
addEventListener("unhandledrejection", e => report(`unhandled: ${e.reason?.message ?? e.reason}\n${e.reason?.stack ?? ""}`))
</script>
<script type="module" src="app.js"></script>
</body>
</html>
