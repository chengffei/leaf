name: Leaf
options:
  bundleIdPrefix: com.chengffei
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  Leaf:
    type: application
    platform: macOS
    sources:
      - path: Leaf
      - path: Web
        type: folder
        buildPhase: resources
    entitlements:
      path: Leaf/Leaf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true # WKWebView 子进程在沙盒里必需，书只从本地读
    info:
      path: Leaf/Info.plist
      properties:
        CFBundleName: Leaf
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Leaf
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "15"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.books
        NSHumanReadableCopyright: "© 2026 Felix"
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: EPUBDocument
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            # 文档图标由 scripts/docicons/gen.swift 生成。PDF 有系统自带的类型图标，Leaf 不自带的话，设成默认打开方式 Finder 也不换
            CFBundleTypeIconFile: PDFDocument
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Kindle Book
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: KindleDocument
            LSHandlerRank: Owner
            LSItemContentTypes: [com.chengffei.leaf.mobi, com.chengffei.leaf.azw3]
          # calibre、Kindle 等装过的话，.mobi/.azw3/.azw 会被系统认成它们登记的 com.amazon.* 类型，
          # 只认自家类型时 Leaf 设成默认打开也不生效
          - CFBundleTypeName: Kindle Book
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: KindleDocument
            LSHandlerRank: Default
            LSItemContentTypes: [com.amazon.mobi, com.amazon.azw3, com.amazon.azw]
          - CFBundleTypeName: FictionBook
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: FB2Document
            LSHandlerRank: Owner
            LSItemContentTypes: [com.chengffei.leaf.fb2, com.chengffei.leaf.fbz]
          - CFBundleTypeName: Comic Book Archive
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: CBZDocument
            LSHandlerRank: Owner
            LSItemContentTypes: [com.chengffei.leaf.cbz]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.chengffei.leaf.mobi
            UTTypeDescription: Mobipocket Book
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, prc]
              public.mime-type: [application/x-mobipocket-ebook]
          - UTTypeIdentifier: com.chengffei.leaf.azw3
            UTTypeDescription: Kindle KF8 Book
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [azw3, azw]
              public.mime-type: [application/vnd.amazon.mobi8-ebook]
          # .fb2.zip 不登记：按扩展名系统只认得 .zip，登记了等于接管所有压缩包
          - UTTypeIdentifier: com.chengffei.leaf.fb2
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
              public.mime-type: [application/x-fictionbook+xml]
          - UTTypeIdentifier: com.chengffei.leaf.fbz
            UTTypeDescription: Zipped FictionBook
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [fbz]
              public.mime-type: [application/x-zip-compressed-fb2]
          - UTTypeIdentifier: com.chengffei.leaf.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengffei.leaf
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        MARKETING_VERSION: "0.5.1"
        DEVELOPMENT_LANGUAGE: en
        ASSETCATALOG_COMPILER_APPICON_NAME: Leaf
        CURRENT_PROJECT_VERSION: "15"
schemes:
  Leaf:
    build:
      targets:
        Leaf: all
    run:
      config: Debug
